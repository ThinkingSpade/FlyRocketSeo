name: Isolated UX review environment

# Branch-create events allow deployment-skip commit flags to remain intact.
on:
  create:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    if: github.event.ref_type == 'branch' && github.event.ref == 'ux/review-environment-parts-2026-10-13'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install the unchanged lockfile
        run: pnpm install --frozen-lockfile
      - name: Export bounded review bundles
        run: |
          mkdir -p /tmp/ux-review/source /tmp/ux-review/deps
          git bundle create /tmp/ux-review/source/repository.bundle --all
          git rev-parse HEAD > /tmp/ux-review/source/commit.txt
          tar -czf /tmp/dependencies.tar.gz node_modules
          split -b 180M /tmp/dependencies.tar.gz /tmp/ux-review/deps/part-
          PNPM_ROOT=$(dirname "$(dirname "$(readlink -f "$(command -v pnpm)")")")
          tar -czf /tmp/ux-review/source/pnpm.tar.gz -C "$PNPM_ROOT" .
          sha256sum /tmp/dependencies.tar.gz /tmp/ux-review/deps/* > /tmp/ux-review/source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ux-review-source
          path: /tmp/ux-review/source/
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ux-review-dependencies-a
          path: /tmp/ux-review/deps/part-aa
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ux-review-dependencies-b
          path: /tmp/ux-review/deps/part-ab
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ux-review-dependencies-c
          path: /tmp/ux-review/deps/part-ac
          retention-days: 1
          compression-level: 0
