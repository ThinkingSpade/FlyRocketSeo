name: UX refinement acceptance
on:
  create:
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  verify:
    if: github.event.ref_type == 'branch' && startsWith(github.event.ref, 'ux/apply-refine-')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ux-refinement-transfer
          path: scripts/ux/refinement.patch.gz
          retention-days: 1
      - name: Verify transport and apply only to the preserved UX base
        run: |
          python - <<'PY'
          import gzip, hashlib, pathlib
          patch = gzip.decompress(pathlib.Path('scripts/ux/refinement.patch.gz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == '338e568bf93fdd546fa42884851f49d83b810de4e95c90fefb93bbd9ac036fa6'
          pathlib.Path('../verified-refinement.patch').write_bytes(patch)
          PY
          git checkout --detach 1db6093128bf320abec956a7bbea717af4afae02
          git apply --index ../verified-refinement.patch
          mkdir -p ux-checks ux-evidence
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Static checks
        id: static
        continue-on-error: true
        run: pnpm run ci:check 2>&1 | tee ux-checks/static.log
      - name: Unit tests
        id: unit
        continue-on-error: true
        run: pnpm test 2>&1 | tee ux-checks/unit.log
      - name: Build without deployment
        id: build
        continue-on-error: true
        run: pnpm run build 2>&1 | tee ux-checks/build.log
      - run: pnpm exec playwright install --with-deps chromium
      - name: Prepare isolated application
        run: |
          printf 'AUTH_MODE=local_noauth\nVITE_E2E_DOMAIN_FIXTURES=1\nVITE_E2E_KEYWORD_FIXTURES=1\nVITE_SHOW_DEVTOOLS=false\n' > .env.local
          pnpm exec wrangler d1 migrations apply DB --local
      - name: Real application browser checks
        id: browser
        continue-on-error: true
        env:
          AUTH_MODE: local_noauth
          PORT: "3101"
          WRANGLER_SEND_METRICS: "false"
          NODE_OPTIONS: --max-old-space-size=3072
        run: |
          pnpm exec vite dev --host 127.0.0.1 --strictPort > ux-evidence/server.log 2>&1 &
          for i in {1..80}; do if curl -s http://127.0.0.1:3101/ > /dev/null; then break; fi; sleep 2; done
          node scripts/ux/browser-review.mjs 2>&1 | tee ux-checks/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-refinement-evidence
          path: |
            ux-evidence/
            ux-checks/
          retention-days: 7
      - name: Publish tested changes to the UX branch only
        if: always()
        env:
          STATIC: ${{ steps.static.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          test "$STATIC" = success
          test "$UNIT" = success
          test "$BUILD" = success
          test "$BROWSER" = success
          test "$(git ls-remote origin refs/heads/ux/product-quality-2026-10-13 | cut -f1)" = 1db6093128bf320abec956a7bbea717af4afae02
          git config user.name 'ThinkingSpade'
          git config user.email '78726553+ThinkingSpade@users.noreply.github.com'
          git commit -m '[CF-Pages-Skip] [skip ci] feat: prioritize evidence-backed actions and complete research interactions'
          git push origin HEAD:refs/heads/ux/product-quality-2026-10-13
          git rev-parse HEAD | tee ux-evidence/published-commit.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ux-published-commit
          path: ux-evidence/published-commit.txt
          retention-days: 7
