name: UX browser review
on:
  create:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  browser:
    if: github.event.ref_type == 'branch' && startsWith(github.event.ref, 'ux/verify-quality-')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Prepare isolated local app
        run: |
          mkdir -p ux-evidence
          printf 'AUTH_MODE=local_noauth\nVITE_E2E_DOMAIN_FIXTURES=1\nVITE_E2E_KEYWORD_FIXTURES=1\nVITE_SHOW_DEVTOOLS=false\n' > .env.local
          pnpm exec wrangler d1 migrations apply DB --local
      - name: Browser inspection
        env:
          AUTH_MODE: local_noauth
          PORT: "3101"
          WRANGLER_SEND_METRICS: "false"
          NODE_OPTIONS: --max-old-space-size=3072
        run: |
          pnpm exec vite dev --host 127.0.0.1 --strictPort > ux-evidence/server.log 2>&1 &
          for i in {1..80}; do if curl -s http://127.0.0.1:3101/ > /dev/null; then break; fi; sleep 2; done
          node scripts/ux/browser-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-browser-evidence
          path: ux-evidence/
          retention-days: 7
